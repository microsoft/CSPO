### model
model_name_or_path: models/Qwen2.5-VL-3B-Instruct # Change to your own model path
#image_max_pixels: 2097152
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false  # choices: [true, false]
freeze_multi_modal_projector: false  # choices: [true, false]
freeze_language_model: false  # choices: [true, false]
deepspeed: examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: mllm_table_sft_10k
media_dir: datasets/tabletex/ # Change to your own dataset image path
template: qwen2_vl
cutoff_len:  16384
max_samples: 500000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2_5_vl_sft_3b # Change to your own output path
logging_steps: 1 
save_steps: 156
plot_loss: true
overwrite_output_dir: true
report_to: wandb


### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

